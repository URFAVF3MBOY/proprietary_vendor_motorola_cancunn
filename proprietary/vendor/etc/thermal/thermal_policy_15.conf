[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ap_ntc,battery,quiet_ntc]
ref_sensor_class= [kernel,kernel,kernel]
operation= coefficient
coef= [0.1278,0.0051641,0.85827]
offset= 695.5567
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ap_ntc,battery,quiet_ntc]
ref_sensor_class= [kernel,kernel,kernel]
operation= coefficient
coef= [0.3378,-0.100564,0.71943]
offset= 21.6529
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= safety_temp
ref_sensor= [tspk_ntc,quiet_ntc,chg_ntc]
ref_sensor_class= [kernel,kernel,kernel]
operation= coefficient
coef= [1.573,-0.367,-0.298]
offset= 1640
trip_sensor= tspk_ntc
trip_sensor_type=kernel
trip_temp= 47000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 0
threshold= [39000, 42000, 44000, 46000, 47000]
hysteresis= [2000, 2000, 2000, 2000, 1000]
freq= [1900000, 1800000, 1600000, 1550000, 1500000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 1
threshold= [38500, 40500, 43000, 45000, 47000]
hysteresis= [2000, 2000, 2000, 2000, 2000]
freq= [2150000, 2050000, 1850000, 1750000, 1550000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= safety_temp
cluster= 0
threshold= [46000, 47000, 48000]
hysteresis= [1000, 1000, 1000]
freq= [1100000, 800000, 600000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= safety_temp
cluster= 1
threshold= [46000, 47000, 48000]
hysteresis= [1000, 1000, 1000]
freq= [1150000, 850000, 650000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= back_temp
threshold= [45000, 47000, 49000]
hysteresis= [2000, 2000, 2000]
freq= [725000, 683000, 652000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [36000, 37000, 38000, 40000, 41500, 44000, 48000]
hysteresis= [1000, 1000, 1000, 2000, 1500, 2000, 2000]
current= [4500, 4000, 3000, 2000, 1000, 600, 300]

[general-cooler]
sensor= ap_ntc
sensor_class= kernel
cooler= moto_wlc
cooler_class= kernel
algorithm= table_mapping
threshold= [36000, 37000, 38000, 39000, 42000, 44000]
hysteresis= [1000, 1000, 1000, 1000, 3000, 2000]
limit_state= [2, 3, 4, 5, 6, 7]

[backlight-cooler]
mode= enabled
sensor= safety_temp
threshold= [45000, 46000, 47000]
hysteresis= [1000, 1000, 1000]
reduce-brightness= [10, 20, 30]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [80000, 85000, 90000, 95000]
