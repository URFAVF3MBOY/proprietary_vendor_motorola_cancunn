[policy_type]
# If permanent= Yes, this policy is still valid after reboot
permanent= Yes

[LTF-disable-throttling]
# If HW_protection= disabled, it will turn off
# SW shutdown protections and LVTS HW reboot protection
HW_protection= enabled

[user-virtual-sensor]
virtual_sensor= front_temp
ref_sensor= [ap_ntc,battery,quiet_ntc]
ref_sensor_class= [kernel,kernel,kernel]
operation= coefficient
coef= [0.085617376,0.064576456,0.750898373]
offset= 5275.13939
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[user-virtual-sensor]
virtual_sensor= back_temp
ref_sensor= [ap_ntc,battery,quiet_ntc]
ref_sensor_class= [kernel,kernel,kernel]
operation= coefficient
coef= [0.1672747,0.064704835,0.64697888]
offset= 4763.19713
trip_sensor= ap_ntc
trip_sensor_type=kernel
trip_temp= 10000
hysteresis= 2000

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 0
threshold= [43000, 44000, 46000, 48000]
hysteresis= [1000, 1000, 2000, 2000]
freq= [1800000, 1700000, 1600000, 1500000]

[mtk-cpu-table-mapping]
mode= enabled
sensor= front_temp
cluster= 1
threshold= [43000, 44000, 46000, 48000]
hysteresis= [1000, 1000, 2000, 2000]
freq= [1950000, 1750000, 1650000, 1550000]

[mtk-gpu-table-mapping]
mode= enabled
sensor= back_temp
threshold= [55000, 57000, 59000]
hysteresis= [2000, 2000, 2000]
freq= [725000, 683000, 652000]

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [36000, 37000, 38000, 40000, 42000, 44000]
hysteresis= [1000, 1000, 1000, 2000, 2000, 2000]
current= [4500, 4000, 3000, 2000, 1000, 600]

[general-cooler]
sensor= ap_ntc
sensor_class= kernel
cooler= moto_wlc
cooler_class= kernel
algorithm= table_mapping
threshold= [36000, 37000, 38000, 39000, 42000, 44000]
hysteresis= [1000, 1000, 1000, 1000, 3000, 2000]
limit_state= [2, 3, 4, 5, 6, 7]

[thermalhal-threshold]
type= SKIN
sensor= ap_ntc
level= [severe, critical, emergency, shutdown]
threshold= [80000, 85000, 90000, 95000]
