[policy_type]
# kpoc mode does not support "permanent"

[charger-cooler]
mode= enabled
sensor= ap_ntc
threshold= [39000, 42000, 43000, 44000, 46000]
hysteresis= [2000, 2000, 1000, 1000, 2000]
current= [5000, 4500, 3000, 2000, 1000]

[general-cooler]
sensor= ap_ntc
sensor_class= kernel
cooler= moto_wlc
cooler_class= kernel
algorithm= table_mapping
threshold= [44000, 46500, 47000, 47500, 48500]
hysteresis= [2000, 2000, 500, 500, 1000]
limit_state= [1, 2, 3, 4, 5]
